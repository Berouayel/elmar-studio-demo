// Small multilingual nearest-neighbour intent model. Character n-grams support inflections.
function features(s){let v=new Map();for(const w of norm(s).split(' ').filter(w=>w.length>2)){v.set(w,3);let a='^'+w+'$';for(let i=0;i<a.length-2;i++){let k='@'+a.slice(i,i+3);v.set(k,(v.get(k)||0)+.45)}}return v}
const trained=Object.entries(examples).flatMap(([intent,lines])=>lines.map(s=>({intent,v:features(s)})));
function cos(a,b){let dot=0,p=0,q=0;for(const [k,v] of a){dot+=v*(b.get(k)||0);p+=v*v}for(const v of b.values())q+=v*v;return dot/Math.sqrt(p*q||1)}
const stop=new Set(norm('avec pour dans des les sans deux mes sur een het met voor mijn van twee winkel winkels magasin magasins store stores shop shopfit ouverture opening open projet projets project projecten retail chantier commerce restaurant montrer quels find references rénover travaux').split(' '));
function rank(s){const tokens=[...new Set(norm(s).split(' ').filter(k=>k.length>2&&!stop.has(k)))];return DATA.map(p=>{const words=norm(p.title+' '+p.place).split(' ');return {p,score:tokens.reduce((a,w)=>a+(words.includes(w)?1:0),0)}}).filter(x=>x.score).sort((a,b)=>b.score-a.score).map(x=>x.p)}
function classify(s){let v=features(s);let scores=trained.map(e=>[e.intent,cos(v,e.v)]).sort((a,b)=>b[1]-a[1]);return scores[0][1]>.14?scores[0][0]:null}
const safeLink=(url,label)=>'<a target="_blank" rel="noopener" href="'+esc(url)+'">'+esc(label)+'</a>';
function analyze(s){let matched=rank(s);let intent=classify(s)||(matched.length?'lookup':null);return {s,intent,matched}}
function requestFacts(s){
 const result=[];
 const count=s.match(/\b(\d{1,4})\s+(?:winkels?|vestigingen|locaties|magasins?|boutiques?|sites?|stores?|shops?|locations?)\b/i);
 if(count)result.push([t('siteCount'),count[1]]);
 const month=s.match(/\b(?:januari|january|janvier|février|februari|february|maart|march|mars|april|avril|mei|may|mai|juni|june|juin|juli|july|juillet|augustus|august|août|september|septembre|oktober|october|octobre|november|novembre|december|décembre)(?:\s+20\d{2})?\b/i);
 if(month)result.push([t('targetDate'),month[0]]);
 return result;
}
function showAnswer(){const el=$('answer');if(!answer){el.hidden=true;return}el.hidden=false;const {s,intent,matched}=answer;if(!intent){el.innerHTML='<h3>'+t('unknown')+'</h3><p>'+t('unclear')+'</p>';return}
 let refs=matched.slice(0,3);el.innerHTML='<h3>'+t(intent==='opening'?'opening':intent)+'</h3><p>'+t(intent+'Body')+'</p><p class="guide"><b>'+t('questions')+'</b><br>'+t(intent+'Q')+'</p>'+(refs.length?'<p><b>'+t('sourceref')+'</b></p><div class="refrow">'+refs.map(r=>safeLink(r.url,r.title+' ↗')).join('')+'</div><p class="studionote">'+t('scope')+'</p>':'')+'<div class="refrow">'+safeLink(intent==='care'?service:retail,t('services'))+(intent==='reno'?'<a href="#simulator">'+t('compare')+'</a>':'')+'</div><button class="smallbtn" id="attach">'+(saved.request?.s===s?t('saved'):t('addPlan'))+'</button><div class="studionote">'+t('model')+'</div>';
 const facts=requestFacts(s);
 if(facts.length){const block=document.createElement('div');block.className='requirements';block.setAttribute('aria-label',t('userFacts'));block.innerHTML=facts.map(([k,v])=>'<span><small>'+esc(k)+'</small><strong>'+esc(v)+'</strong></span>').join('');el.querySelector('h3').after(block)}
 if(intent==='lookup'&&matched.length>=2){
   const picks=matched.map(p=>featured.findIndex(f=>bySlug(f[0]).url===p.url)).filter(i=>i>=0);
   if(picks.length>=2){const pairButton=document.createElement('button');pairButton.className='smallbtn';pairButton.textContent=t('openPair');pairButton.onclick=()=>openPair(picks.slice(0,2));$('attach').before(pairButton)}
 }
 $('attach').onclick=()=>{saved.request={s,intent};refreshCount();showAnswer();notify(t('saved'))}
}

const money=n=>new Intl.NumberFormat(['fr-FR','nl-NL','en-IE'][lang],{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);

 $('filters').innerHTML=Object.keys(sectorSelection).map(k=>'<button data-sector="'+k+'" aria-pressed="'+(k===selectedSector)+'">'+t(k)+'</button>').join('');
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedSector=b.dataset.sector;gallery();$('filters').querySelector('[aria-pressed="true"]').focus({preventScroll:true})});
 $('cards').innerHTML=sectorSelection[selectedSector].map(i=>{const f=featured[i];return '<button class="card" data-card="'+i+'"><img loading="lazy" alt="'+esc(f[1])+'" src="'+IMAGES[f[3]]+'"><span class="cardmeta"><span><strong>'+f[1]+'</strong><small>'+f[2]+'</small></span><i aria-hidden="true">↗</i></span></button>'}).join('');
 $('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>project(bySlug(featured[b.dataset.card][0])));
}
function project(p){activeProject=p;activateDialog('project',p.title);let f=featured.find(x=>bySlug(x[0]).url===p.url);$('db').innerHTML=(f?'<img class="detailphoto" src="'+IMAGES[f[3]]+'" alt="'+esc(f[1])+'">':'')+'<strong>'+esc(f?f[2]:p.place)+'</strong><p class="muted">'+t('scope')+'</p><div class="dialog-actions"><button class="pill blue" id="pick"></button>'+safeLink(p.url,t('detail'))+'</div><button class="smallbtn" id="back">'+t('all')+'</button>';
 let button=$('pick');button.textContent=saved.refs.includes(p.url)?t('saved'):t('save');button.onclick=()=>{addRef(p);button.textContent=t('saved')};$('back').onclick=openCatalog}
function openCatalog(){activateDialog('catalog',t('catalog'));$('db').innerHTML='<label class="search-label">'+t('search')+'<input class="querybox" id="filter"></label><span class="muted" id="total"></span><div id="results" class="results"></div><button class="smallbtn" id="more">'+t('more')+'</button>';$('filter').value=searchText;$('filter').oninput=e=>{searchText=e.target.value;limit=12;listProjects()};$('more').onclick=()=>{limit+=18;listProjects()};listProjects()}
function listProjects(){let keys=norm(searchText).split(' ').filter(Boolean);searchList=DATA.filter(p=>keys.every(k=>norm(p.title+' '+p.place).includes(k)));$('total').textContent=searchList.length+' '+t('hits');$('results').innerHTML=searchList.length?searchList.slice(0,limit).map((p,i)=>'<div class="result"><button class="textbutton" data-detail="'+i+'">'+esc(p.title)+'</button><button class="smallbtn" data-save="'+i+'">'+(saved.refs.includes(p.url)?'✓':'+')+' <span class="sr">'+t('save')+' '+esc(p.title)+'</span></button></div>').join(''):'<p class="empty">'+t('nomatch')+'</p>';$('more').hidden=searchList.length<=limit;$('results').onclick=e=>{let b=e.target.closest('button');if(!b)return;if('detail'in b.dataset)project(searchList[b.dataset.detail]);else{addRef(searchList[b.dataset.save]);listProjects()}}}
function briefText(){const out=['ELMAR SERVICES | '+t('brief')];if(saved.request)out.push(t('request')+' — '+saved.request.s,t(saved.request.intent+'Q'));if(saved.refs.length)out.push(t('sourceref'),...saved.refs.map(u=>DATA.find(p=>p.url===u).title+' — '+u));if(saved.calc){let v=calc(saved.calc);out.push(t('calc'),...saved.calc.map((n,i)=>t(fieldkeys[i])+': '+n),v.text,v.math,t('noquote'))}if(saved.notes.trim())out.push(t('notelabel'),saved.notes);return out.join('\n\n')}
function openBrief(){activateDialog('brief',t('brief'));let parts=[];
 if(saved.request)parts.push([t('request'),saved.request.s,'req']);for(const url of saved.refs){const p=DATA.find(x=>x.url===url);parts.push([t('source'),p.title,url])}if(saved.calc){let v=calc(saved.calc);parts.push([t('calc'),v.text+' · '+v.math,'calc'])}
 $('db').innerHTML='<span class="muted">'+t('session')+'</span>'+(parts.length?parts.map(([tag,name,key])=>'<div class="result"><div><small>'+esc(tag)+'</small><br><b>'+esc(name)+'</b></div><button class="smallbtn" data-remove="'+esc(key)+'">'+t('remove')+'</button></div>').join(''):(saved.notes?'':'<p>'+t('none')+'</p>'))+'<label class="editlabel">'+t('notelabel')+'<textarea class="edit" id="notes" rows="3"></textarea></label><button class="pill blue" id="download">'+t('download')+'</button>';
 $('notes').value=saved.notes;$('notes').placeholder=t('notes');$('download').disabled=!Number($('count').textContent);$('notes').oninput=e=>{saved.notes=e.target.value;refreshCount();$('download').disabled=!Number($('count').textContent)};$('db').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let key=b.dataset.remove;if(key==='req')saved.request=null;else if(key==='calc')saved.calc=null;else saved.refs=saved.refs.filter(u=>u!==key);refreshCount();openBrief();showAnswer()});$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+briefText()],{type:'text/plain;charset=utf-8'}));a.download='Elmar-brief-'+locales[lang]+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function render(){document.documentElement.lang=locales[lang];document.title='Elmar Services — '+t('assistant');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('prev').ariaLabel=t('prev');$('next').ariaLabel=t('next');$('close').ariaLabel=t('close');$('send').ariaLabel=t('send');$('question').placeholder=t('placeholder');$('chips').innerHTML=['chip1','chip2','chip3'].map(k=>'<button class="chip">'+t(k)+'</button>').join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('question').value=b.textContent;run()});
 gallery();$('compareLaunch').onclick=()=>openPair();
 $('fields').innerHTML=fieldkeys.map((k,i)=>'<label>'+t(k)+'<input required type="number" min="0" max="'+([1e8,3650,3650,1e10][i])+'" step="'+([1,2].includes(i)?1:.01)+'" id="'+k+'" value="'+amounts[i]+'"></label>').join('');$('fields').oninput=calcView;calcView();hero();showAnswer();refreshCount()}
function run(){let s=$('question').value.trim();if(!s)return;answer=analyze(s);showAnswer();$('answer').scrollIntoView({block:'nearest'})}
$('askForm').onsubmit=e=>{e.preventDefault();run()};$('lang').onchange=e=>{lang=locales.indexOf(e.target.value.toLowerCase());render()};$('prev').onclick=()=>{slide=(slide+featured.length-1)%featured.length;hero()};$('next').onclick=()=>{slide=(slide+1)%featured.length;hero()};$('briefTop').onclick=openBrief;$('catalog').onclick=openCatalog;$('close').onclick=()=>$('dialog').close();$('dialog').onclick=e=>{if(e.target===$('dialog')){let r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}};$('include').onclick=()=>{saved.calc=[...amounts];refreshCount();notify(t('saved'))};$('toStudio').onclick=()=>setTimeout(()=>$('question').focus({preventScroll:true}),200);render();
</script></body></html>
